# The ticket's automated review: the test suite, type checking and a dependency
# audit. All three must pass.
#
# "A failing check blocks the merge — no human override" is a branch protection
# setting, not something this file can assert. Require this workflow on main and
# disable administrator override for it.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CROWN_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migration applies to an empty database
        run: |
          psql -v ON_ERROR_STOP=1 -d "$CROWN_ADMIN_DSN" -c 'CREATE DATABASE crown_migration_check'
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0001_ticket01_thin_loop.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0002_rls_policies.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0003_retrieval_method.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0004_integrity_fixes.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0005_audit_and_controls.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0006_real_authentication.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0007_personal_information.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0008_prospecting_controls.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0009_automated_access.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0010_land_layer.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0011_market_signals.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0012_watchlists_and_alerts.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0013_close_the_base_tables.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0014_terms_read.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0015_councils_and_signature.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0016_going_live.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0017_close_the_sender_identity.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0018_operational_readiness.sql
          psql -v ON_ERROR_STOP=1 -d "postgresql://postgres:postgres@127.0.0.1:5432/crown_migration_check" \
               -f migrations/0019_crown_sends_as_itself.sql
               -f migrations/0020_an_identity_that_means_something.sql
               -f migrations/0021_the_sender_changes_address.sql
               -f migrations/0022_the_public_inbox_is_not_the_login.sql
               -f migrations/0023_the_abn_is_confirmed.sql
               -f migrations/0024_the_channel_is_part_of_the_decision.sql
               -f migrations/0025_the_way_out_is_findable.sql

      - name: Test suite
        run: python -m pytest -q

      - name: Type check
        run: python -m mypy

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt --progress-spinner off
